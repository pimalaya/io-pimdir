[package]
name = "io-pimdir"
description = "Rust implementation of the Pimdir standard: the store and the sync engine"
version = "0.10.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "command-line-utilities", "database", "no-std"]
keywords = ["pimdir", "sqlite", "sync", "no-std", "io-free"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-pimdir/latest/io_pimdir"
repository = "https://github.com/pimalaya/io-pimdir"
exclude = [
  ".github/",
  "AGENTS.md",
  "CLAUDE.md",
  "cairn/",
  "default.nix",
  "deny.toml",
  "flake.lock",
  "flake.nix",
  "package.nix",
  "shell.nix",
  "spec/payloads/",
  "spec/vectors/",
  "tests/proptest-regressions/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client", "vendored"]
client = ["dep:fs4", "dep:rusqlite", "dep:rustix"]
search = ["dep:ical-rs", "dep:mime-rs", "dep:unicode-normalization", "dep:vcard-rs"]
cli = ["client", "search", "dep:anyhow", "dep:clap", "dep:humantime", "dep:pimalaya-cli", "dep:schemars", "dep:simd-cpu"]
vendored = ["rusqlite?/bundled"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "pimdir"
path = "src/main.rs"
required-features = ["cli"]

[build-dependencies]
pimalaya-cli = { version = "0.4", default-features = false, features = ["build"], optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
tempfile = { version = "3", default-features = false }

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"], optional = true }
blake3 = { version = "1", default-features = false }
clap = { version = "4.4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"], optional = true }
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
fs4 = { version = "1.1", default-features = false, features = ["sync"], optional = true }
humantime = { version = "2.2", default-features = false, optional = true }
ical-rs = { version = "0.7", default-features = false, features = ["parser", "tzdb"], optional = true }
jiff = { version = "0.2.33", default-features = false, features = ["alloc", "tzdb-bundle-always"] }
log = { version = "0.4", default-features = false }
mime-rs = { version = "0.1", default-features = false, features = ["parser", "base64", "encoding"], optional = true }
pimalaya-cli = { version = "0.4", default-features = false, features = ["prompt", "terminal"], optional = true }
rusqlite = { version = "0.41", default-features = false, features = ["cache"], optional = true }
schemars = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
simd-cpu = { version = "0.1", default-features = false, features = ["std"], optional = true }
unicode-normalization = { version = "0.1", default-features = false, optional = true }
vcard-rs = { version = "0.6", default-features = false, features = ["parser"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"], optional = true }

[patch.crates-io]
pimalaya-cli = { git = "https://github.com/pimalaya/cli", rev = "5ad858f5bf6b546f3e1c7124cc97418adf89f7ed" }
