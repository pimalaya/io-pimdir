[package]
name = "io-pimdir"
description = "Rust implementation of the Pimdir standard: the store and the sync engine"
version = "0.8.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.88"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "command-line-utilities", "database", "no-std"]
keywords = ["pimdir", "sqlite", "sync", "no-std", "io-free"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-pimdir/latest/io_pimdir"
repository = "https://github.com/pimalaya/io-pimdir"
exclude = [
  ".github/",
  "AGENTS.md",
  "CLAUDE.md",
  "cairn/",
  "default.nix",
  "deny.toml",
  "flake.lock",
  "flake.nix",
  "package.nix",
  "shell.nix",
  "tests/proptest-regressions/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client", "vendored"]
client = ["dep:fs4", "dep:rusqlite"]
search = ["client", "rusqlite/functions", "dep:ical-rs", "dep:mail-parser", "dep:vcard-rs"]
cli = ["client", "search", "dep:anyhow", "dep:clap", "dep:humantime", "dep:pimalaya-cli", "dep:schemars"]
vendored = ["rusqlite?/bundled"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "pimdir"
path = "src/main.rs"
required-features = ["cli"]

[build-dependencies]
pimalaya-cli = { version = "0.2", default-features = false, features = ["build"], optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = { version = "3", default-features = false }

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"], optional = true }
blake3 = { version = "1", default-features = false }
clap = { version = "4.4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions", "wrap_help"], optional = true }
fs4 = { version = "1.1", default-features = false, features = ["sync"], optional = true }
humantime = { version = "2.2", default-features = false, optional = true }
ical-rs = { version = "0.6", default-features = false, features = ["parser", "tzdb"], optional = true }
log = { version = "0.4", default-features = false }
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"], optional = true }
pimalaya-cli = { version = "0.2", default-features = false, features = ["prompt", "table", "terminal"], optional = true }
rusqlite = { version = "0.40", default-features = false, optional = true }
schemars = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
vcard-rs = { version = "0.5", default-features = false, features = ["parser"], optional = true }

[patch.crates-io]
ical-rs = { git = "https://github.com/pimalaya/ical", rev = "99b92736a6a076c72936fac29c9b85a5168e4c2f" }
pimalaya-cli = { git = "https://github.com/pimalaya/cli", rev = "55b66933950f02541892407667e5e0b254245871" }
