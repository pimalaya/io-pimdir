[package]
name = "io-pimdir"
description = "pimdir store for Rust: a SQLite and content-addressed blob storage backend for io-replica"
version = "0.1.0"
authors = ["soywod <pimalaya.org@posteo.net>"]
rust-version = "1.87"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "database", "no-std"]
keywords = ["pimdir", "sqlite", "storage", "no-std", "io-free"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-pimdir/latest/io_pimdir"
repository = "https://github.com/pimalaya/io-pimdir"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client"]
client = ["dep:rusqlite"]

[dev-dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tempfile = { version = "3", default-features = false }

[dependencies]
io-replica = "0.2"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
