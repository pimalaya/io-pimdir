name: Tests

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt + clippy + deny + test
    runs-on: ubuntu-latest
    steps:
      # NOTE: the suites proving the crate against the spec read its vendored
      # copy under spec/, so they run without a pimdir checkout. The one
      # beside this one serves tests/spec_drift.rs alone, which compares
      # spec/ with pimdir at the revision spec/REVISION names: drift between
      # the two repositories is exactly what nothing else notices.
      - uses: actions/checkout@v4
        with:
          path: io-pimdir
      - id: pin
        run: echo "revision=$(cat io-pimdir/spec/REVISION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: pimalaya/pimdir
          ref: ${{ steps.pin.outputs.revision }}
          path: pimdir
      # The system link, the one Nix builds and consumers turning `vendored`
      # off take, needs the library before anything compiles.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # NOTE: every feature, so the dependencies of `cli` and `search`
      # (the git2 and libz-sys of the build tooling among them) are checked
      # too.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: io-pimdir/Cargo.toml
          arguments: --all-features
      - run: cargo fmt --all --check
        working-directory: io-pimdir
      - run: cargo clippy --all-features --all-targets -- -D warnings
        working-directory: io-pimdir
      - run: cargo test --all-features
        working-directory: io-pimdir
      # The test generator is a crate of its own, outside the package.
      - run: cargo test
        working-directory: io-pimdir/spec/generator
      # The defaults and --all-features both turn `vendored` on, so the
      # system link is proven on its own or it is never built here at all.
      - run: cargo test --no-default-features --features cli
        working-directory: io-pimdir
      # The integration tests need the client, so the no_std core is
      # proven by its unit tests alone.
      - run: cargo test --no-default-features --lib
        working-directory: io-pimdir
      - name: Each search feature builds alone
        working-directory: io-pimdir
        run: |
          set -eu
          for features in mail contact calendar search indexer search,mail search,indexer; do
            cargo clippy --no-default-features --features "vendored,$features" --all-targets -- -D warnings
          done
      - name: The feature sets consumers build
        working-directory: io-pimdir
        run: |
          set -eu
          cargo check
          cargo check --no-default-features --features client
          cargo check --no-default-features --features client,search,indexer
      # spec_drift compares nothing when the checkout lacks the pinned
      # revision, so a green run proves nothing unless it compared.
      - name: The vendored copy was compared with pimdir
        working-directory: io-pimdir
        run: |
          set -eu
          if cargo test --all-features --test spec_drift -- --nocapture 2>&1 | grep -q "nothing compared"; then
            echo "::error::spec_drift compared nothing: the pimdir checkout lacks spec/REVISION"
            exit 1
          fi

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --all-features
      - run: cargo check --no-default-features --features client

  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Baseline 1.0.0, compared once it is on crates.io.
      - id: baseline
        run: |
          if curl -sfA "io-pimdir CI" https://crates.io/api/v1/crates/io-pimdir/1.0.0 >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.baseline.outputs.published == 'true'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - if: steps.baseline.outputs.published == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-version: 1.0.0
          feature-group: all-features
